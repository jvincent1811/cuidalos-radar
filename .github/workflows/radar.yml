name: Ejecutar Radar de Cuidalos

on:
  workflow_dispatch: 
  repository_dispatch:
    types: [radar_trigger]
  schedule:
    - cron: '0 8 * * *'

jobs:
  analizar_perfiles:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3
      
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Instalar dependencias ligeras
        run: pip install requests
        
      - name: Ejecutar el Radar
        env:
          RADAR_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          VERCEL_ALERT_WEBHOOK: ${{ secrets.VERCEL_ALERT_WEBHOOK }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python radar.py
